name: CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Force deploy."
        required: false
        type: boolean
        default: false
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_COLOR: "3"

jobs:
  docs:
    permissions:
      contents: write # required for update/download
    uses: $/.github/workflows/docs.yml
    with:
      deploy: ${{ (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
